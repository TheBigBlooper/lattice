<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <link rel="icon" href="data:image/svg+xml,{{favicon}}" />
    <link rel="stylesheet" href="{{docsPage}}/swagger-ui.css" />
    <style>
      /* Only the header is styled here. Swagger 5.25.3 ships one light stylesheet with no
         prefers-color-scheme rule and no theming tokens, so a dark page would mean overriding its
         rules indefinitely - the header is styled to sit with its light page instead. Everything
         is inline: this must render on a baseline with no route to anything but itself. */
      body {
        margin: 0;
      }

      /* Not theming. The bundle's top bar carries an "Explore" box that loads ANY spec URL into a
         page served from this origin; the header below replaces it with something true about this
         host, and invites nothing. */
      .swagger-ui .topbar {
        display: none;
      }

      .lattice-bar {
        align-items: center;
        background: #ececee;
        border-bottom: 1px solid #d9d9de;
        color: #16161a;
        display: flex;
        flex-wrap: wrap;
        font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
        gap: 12px;
        padding: 10px 20px;
      }
      .lattice-mark {
        height: 26px;
        width: 26px;
      }
      .lattice-service {
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .lattice-baseline {
        color: #5b5b66;
        font-size: 0.85rem;
      }
      .lattice-baseline b {
        color: #16161a;
        font-weight: 500;
      }
      .lattice-chip {
        border: 1px solid #d9d9de;
        border-radius: 999px;
        color: #5b5b66;
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
        padding: 2px 9px;
      }
      .lattice-note {
        align-items: center;
        background: rgba(178, 106, 0, 0.08);
        border: 1px solid #b26a00;
        border-radius: 6px;
        color: #b26a00;
        display: flex;
        font-size: 0.76rem;
        margin-left: auto;
        padding: 3px 10px;
      }
    </style>
  </head>
  <body>
    <header class="lattice-bar">
      <img alt="" class="lattice-mark" src="data:image/svg+xml,{{favicon}}" />
      <span class="lattice-service">{{service}}</span>
      <span class="lattice-baseline">{{baselineLabel}}</span>
      {{versionChip}}
      <span class="lattice-note">Development surface &middot; disabled in production</span>
    </header>

    <div id="swagger-ui"></div>

    <script src="{{docsPage}}/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="{{docsPage}}/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script src="{{docsPage}}/swagger-initializer.js" charset="UTF-8"></script>
  </body>
</html>
