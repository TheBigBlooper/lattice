# Defaults for one Lattice baseline, as a local kind cluster runs it; a deployed environment
# overrides them. Nothing secret belongs in a committed values file - the chart only names secrets.
# Almost everything is under `global` because a subchart's `.Values` is only its own section, so
# anything crossing a component boundary lives in the one scope both can see. A value only one
# component reads lives in that component's own values.yaml. Detail: baseline_configuration.md.

global:
  # --- This baseline's identity ---------------------------------------------------------------
  # Every value below is per baseline and is what a peer sees when this one announces itself. Two
  # baselines differ HERE and almost nowhere else, which is the point of the topology.
  baseline:
    clusterId: hub-central
    region: local
    # The versioned baseline (services + endpoints) this cluster runs. Also the default image tag
    # and the `app.kubernetes.io/version` label, so the three cannot disagree.
    version: 0.1.0-SNAPSHOT
    # How an operator's browser reaches this baseline, not how a peer's services do - no service
    # dials either of these (locked #37, #61). They must therefore be reachable from wherever
    # operators sit: localhost per baseline locally, the ingress hostnames in a real environment.
    consoleUrl: http://localhost:3000
    apiBaseUrl: http://localhost:8082/api/v1

    # Where a browser reaches each service, keyed by service name. The realm builds the docs client's
    # redirect URIs from it, since the docs page is served by each service. Empty is correct where
    # the services are not exposed to a browser; the local stack derives it from the kind port map.
    serviceUrls: {}

  # --- Images ---------------------------------------------------------------------------------
  # Lattice-built images only; a floating "latest" would make "which baseline is running"
  # unanswerable. Third-party images keep their own policy in their own subchart (see the README).
  image:
    registry: ""
    pullPolicy: IfNotPresent
    tag: ""

  # --- The services in this baseline ----------------------------------------------------------
  # The umbrella authors this list; the mesh-gateway polls it for the health rollup (locked #43).
  # The one list still maintained by hand, recorded as open in baseline_configuration.md.
  services:
    - name: orders
    - name: inventory
    - name: mesh-gateway
      isMeshGateway: true

  # --- Identity, as every service sees it -------------------------------------------------------
  # These cross component boundaries: every service validates tokens against this realm. Keycloak's
  # own sizing and image live in its subchart.
  keycloak:
    realm: lattice
    # The address tokens are ISSUED under. It must be the address a browser and a QA shell both use,
    # because it appears in every token's issuer claim and is checked on validation.
    hostname: http://localhost:8083
    # Dev mode keeps everything in memory, so users, sessions and admin edits are lost on restart -
    # fine for a quick single-cluster run, not production. Persisted, the realm import runs only when
    # the realm is absent, so changing an imported realm is an admin operation, not a redeploy.
    devMode: true

    # Origins allowed to complete a console login besides baseline.consoleUrl, which is always
    # allowed. It exists for the Vite dev server. Keep it empty in a deployment: every entry widens
    # the redirect allow-list, which is a security boundary rather than a convenience setting.
    extraConsoleOrigins:
      - http://localhost:5173
    database:
      # Deploy MySQL with this baseline, or point at one the environment already runs. Both are
      # supported because the customer runs the clusters (locked #55) - the pattern every
      # infrastructure subchart's `enabled` flag generalises.
      deployInCluster: true
      # MySQL 8.4 LTS, a version Keycloak supports. Pinned because an unpinned datastore is a silent
      # upgrade of the thing holding the data. Here rather than in the keycloak-db subchart because
      # Keycloak's own init container uses it to wait for the database.
      image: mysql:8.4
      name: keycloak
      # Where Keycloak REACHES the database. Empty means the in-cluster MySQL the keycloak-db
      # subchart deploys; set it when deployInCluster is false. A false/empty pair fails the render
      # rather than deploying a Keycloak that cannot start.
      host: ""
      port: 3306
      # Extra JDBC connection properties, e.g. sslMode=REQUIRED against a managed database.
      urlProperties: ""
      # Created from an untracked source and only NAMED here - the chart never carries credentials.
      credentialsSecret: keycloak-db-credentials

  # --- The datastore, as every service sees it --------------------------------------------------
  # The image is here rather than in the subchart because the services' init container uses it to
  # wait for the datastore. Its sizing lives in the elasticsearch subchart.
  elasticsearch:
    # Pinned to the same version as the ES Java client and Testcontainers image (locked #34).
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19

  # --- The broker, as the gateway sees it -------------------------------------------------------
  # Only the credential name crosses the boundary: the gateway needs it to authenticate to its own
  # broker. Everything about how the broker is built, exposed and federated is the artemis subchart's.
  artemis:
    credentialsSecret: artemis-credentials

  # --- API documentation ------------------------------------------------------------------------
  # A Swagger UI at /docs and the OpenAPI document at /docs/json, from the same document that drives
  # router validation. Turn it off for production: it publishes every endpoint's exact shape.
  apiDocs:
    enabled: true

  # --- Probes -----------------------------------------------------------------------------------
  # /health and /readiness are unauthenticated by contract, which is what lets kubelet call them.
  probes:
    readinessPath: /readiness
    livenessPath: /health
    initialDelaySeconds: 10
    periodSeconds: 10

  resources: {}

  # --- What a container is allowed to become ----------------------------------------------------
  # Applied to Lattice-built services; each infrastructure subchart carries its own, because what an
  # image tolerates is a property of that image. Per-component measurements: baseline_configuration.md.
  securityContext:
    # The only one every image here accepts: a setuid binary cannot be a way up.
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # --- Host exposure (local multi-cluster runs only) ---------------------------------------------
  # Empty keeps every service ClusterIP, which is right for a real deployment; set only by
  # mesh-clusters.sh. One map, because a port list read in several places is how the three drift.
  serviceNodePorts: {}

  # Override only when the console is served somewhere other than baseline.consoleUrl, or when more
  # than one origin must be allowed. Empty means the console's own address.
  corsAllowedOrigins: ""

# --- Which components this baseline deploys -----------------------------------------------------
# Every component in its own pod is a subchart with an `enabled` flag, so infrastructure can point at
# what the environment runs (locked #55). The services have none: without them it is not a baseline.
elasticsearch:
  enabled: true

artemis:
  enabled: true

keycloak:
  enabled: true

# keycloak-db has no flag of its own on purpose. Its Chart.yaml condition reads
# global.keycloak.database.deployInCluster, so the decision to run a database and the address
# Keycloak is given can never disagree.

status-console:
  enabled: true

# --- Data maintenance jobs ---------------------------------------------------------------------
# Reindex, seed and reset, as CronJobs a person triggers on purpose: suspended on a never-occurring
# schedule so a deploy never runs one, and CronJobs because a Job's template is immutable. The guard
# lives in the job - it refuses outright with no `environment`, and allows only reindex under `prod`.
dataJobs:
  enabled: true
  # local | dev | prod. Deliberately empty by default: a job that does not know which cluster it is
  # pointed at refuses to run, which is the whole safeguard.
  environment: ""
  # Must be exactly "true" to arm a job. Anything else, including "yes", is treated as absent.
  allow: "false"

nodeSelector: {}
tolerations: []
affinity: {}
