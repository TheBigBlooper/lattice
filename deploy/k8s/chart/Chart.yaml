apiVersion: v2
name: lattice
description: One Lattice baseline - a complete, independent cluster with its own identity provider, datastore, and services.
type: application

# The chart's own version, bumped when the chart changes shape.
version: 1.0.0

# No appVersion. The baseline version lives in `global.baseline.version`, which the image tag and the
# `app.kubernetes.io/version` label are both derived from - so declaring it here too would be the
# second copy of one string that locked #77 exists to remove.

keywords:
  - lattice
  - baseline
  - mesh

annotations:
  # One release installs one baseline (locked #54, unchanged by the umbrella split of locked #77).
  # Two baselines are two releases: they are independent by design, and deploying several from one
  # release would give them a shared lifecycle - one upgrade, one rollback, one blast radius.
  lattice.io/scope: single-baseline

# Vendored under charts/, so an air-gapped install has no repository to reach (locked #55). The
# three Vert.x services carry no condition, because a baseline without them is not a baseline;
# infrastructure carries one, because the customer may already run a managed instance.
dependencies:
  - name: lattice-lib
    version: 1.0.0

  - name: orders
    version: 1.0.0
  - name: inventory
    version: 1.0.0
  - name: mesh-gateway
    version: 1.0.0

  - name: status-console
    version: 1.0.0
    condition: status-console.enabled

  - name: elasticsearch
    version: 1.0.0
    condition: elasticsearch.enabled
  - name: artemis
    version: 1.0.0
    condition: artemis.enabled
  - name: keycloak
    version: 1.0.0
    condition: keycloak.enabled
  # Conditioned on the SAME flag Keycloak's own template reads, rather than a second switch of its
  # own. Two switches for one decision is how a baseline ends up with a database nothing connects to,
  # or a Keycloak pointed at one that was never deployed.
  - name: keycloak-db
    version: 1.0.0
    condition: global.keycloak.database.deployInCluster
