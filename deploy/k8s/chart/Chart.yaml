apiVersion: v2
name: lattice
description: One Lattice baseline - a complete, independent cluster with its own identity provider, datastore, and services.
type: application

# The chart's own version, bumped when the chart changes shape.
version: 0.1.0

# NO appVersion. The baseline version lives in `global.baseline.version`, which is what the image tag
# and the `app.kubernetes.io/version` label are both derived from. It was declared here as well until
# the umbrella split, and two copies of one string is the defect this restructure exists to remove -
# a subchart would have had to repeat it eight more times or render a different value.

keywords:
  - lattice
  - baseline
  - mesh

annotations:
  # One release installs ONE baseline. Two baselines are two releases (usually in two clusters), never
  # one release with a list of baselines: baselines are independent by design (locked #44), and a
  # chart that deployed several would make them share a lifecycle they are specifically not supposed
  # to share - one upgrade, one rollback, one blast radius.
  #
  # This clause of locked #54 is UNCHANGED by the umbrella split. What the split amends is only its
  # "one chart at deploy/k8s/chart" clause; a baseline is still the unit a customer receives.
  lattice.io/scope: single-baseline

# --- The components a baseline is made of -------------------------------------------------------
# Vendored under charts/, so there is no repository to reach and no lock file to refresh: a delivery
# is an archive the customer holds (locked #55), and a chart that had to fetch its own dependencies
# at install time would not survive an air-gapped one.
#
# The three Vert.x services carry no condition. A baseline without them is not a baseline, and a
# flag implying otherwise would be an option nobody should take. Infrastructure carries one, because
# the customer runs the clusters and may already run a managed Elasticsearch or database.
dependencies:
  - name: lattice-lib
    version: 0.1.0

  - name: orders
    version: 0.1.0
  - name: inventory
    version: 0.1.0
  - name: mesh-gateway
    version: 0.1.0

  - name: status-console
    version: 0.1.0
    condition: status-console.enabled

  - name: elasticsearch
    version: 0.1.0
    condition: elasticsearch.enabled
  - name: artemis
    version: 0.1.0
    condition: artemis.enabled
  - name: keycloak
    version: 0.1.0
    condition: keycloak.enabled
  # Conditioned on the SAME flag Keycloak's own template reads, rather than a second switch of its
  # own. Two switches for one decision is how a baseline ends up with a database nothing connects to,
  # or a Keycloak pointed at one that was never deployed.
  - name: keycloak-db
    version: 0.1.0
    condition: global.keycloak.database.deployInCluster
