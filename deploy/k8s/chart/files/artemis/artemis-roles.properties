# Lattice broker roles - identical in every baseline.
#
# amq is the image's own broker user, used by THIS baseline's own services over the plain acceptor.
#
# The shared lattice_federation credential that used to live here is GONE (locked #45 was the
# stop-gap; locked #50 replaced it, built in #62). A peer no longer authenticates with a password
# every baseline knew - it presents its own certificate on the mutual-TLS federation acceptor and
# picks the role up from artemis-cert-roles.properties instead. Leaving it here would have kept a
# working shared credential alongside the certificates, which is the same leak with extra steps.
amq = artemis
