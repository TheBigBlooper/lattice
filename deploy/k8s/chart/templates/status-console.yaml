{{- if .Values.statusConsole.enabled }}
{{/*
  The status console ships as this baseline's OWN container, one per baseline (locked #16).

  It carries no environment here on purpose. The console is a static bundle, and its configuration
  (the API base URL, the realm, the client id) is baked in at IMAGE BUILD time as Vite build args -
  so a console image belongs to the baseline it was built for. Setting them here would have no
  effect and would read as though it did, which is worse than not setting them at all.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lattice.fullname" . }}-status-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: console
spec:
  replicas: {{ .Values.statusConsole.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lattice.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      baseline-component: console
  template:
    metadata:
      labels:
        {{- include "lattice.labels" . | nindent 8 }}
        baseline-component: console
    spec:
      containers:
        - name: status-console
          image: {{ include "lattice.image" (dict "root" . "name" "status-console") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lattice.fullname" . }}-status-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "lattice.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    baseline-component: console
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
