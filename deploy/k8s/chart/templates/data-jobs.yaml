{{- if .Values.dataJobs.enabled }}
{{/*
  The data-maintenance jobs, as suspended CronJobs a person triggers on purpose.

  NOT HOOKS, DELIBERATELY. A Helm hook would run these on install or upgrade, which is exactly the
  behaviour to avoid: nobody should reseed a cluster as a side effect of a deploy. These never fire
  on their own, so running one is always a decision someone made.

  CRONJOBS RATHER THAN JOBS, AND NOT FOR SCHEDULING. A Job's spec.template is IMMUTABLE, so these
  three could never be edited once a baseline had them - any change to an environment variable, an
  image, a label or a security context made `helm upgrade` fail outright:

    Job.batch "hub-central-lattice-data-seed" is invalid:
    spec.template.spec: ... field is immutable

  A CronJob's jobTemplate is mutable, so the trap goes for every future edit rather than for the one
  that happened to hit it first. They keep the property that made them Jobs - they exist only to be
  copied from, and `kubectl create job --from=` reads a cronjob as happily as a job, so the
  documented command changes by one word.

  They run the SERVICE IMAGE THAT IS ALREADY BUILT, overriding the container command - there is no
  second artifact to build, tag, and keep in step. `command` is overridden rather than `args`,
  because the image's ENTRYPOINT is `java -jar app.jar`; setting args alone appends to it and starts
  the service instead, which looks like a job that hangs.

  The guard in DataJobGuard is what actually refuses; these values only carry the environment name
  and the opt-in to it. Nothing here can wave a job through: with LATTICE_ENV=prod, the seed and
  reset jobs refuse whatever this file says.
*/}}
{{- range $job := list "seed" "reindex" "reset" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lattice.fullname" $ }}-data-{{ $job }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "lattice.labels" $ | nindent 4 }}
    baseline-component: data-job
    lattice.io/data-job: {{ $job }}
  annotations:
    lattice.io/purpose: >-
      Run on purpose, never on deploy. Start with:
      kubectl create job --from=cronjob/{{ include "lattice.fullname" $ }}-data-{{ $job }} {{ $job }}-$(date +%s)
spec:
  # A schedule is REQUIRED even on a suspended CronJob, so this one is chosen to never occur - the
  # 31st of February. It exists to satisfy the field and nothing else; nobody intended a February
  # date, and reading it as one would be reading a placeholder as a plan.
  schedule: "0 0 31 2 *"
  # Suspended so applying the chart never runs one, and so the schedule above stays theoretical.
  # Creating a job from this template is the deliberate act.
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "lattice.podLabels" $ | nindent 12 }}
            baseline-component: data-job
            lattice.io/data-job: {{ $job }}
        spec:
          restartPolicy: Never
          containers:
            - name: data-job
              image: {{ include "lattice.image" (dict "ctx" $ "name" "orders") | quote }}
              imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
              # The same policy every other container carries. These three were the one exception,
              # and only because a Job template could not be changed to add it.
              securityContext:
                {{- toYaml $.Values.global.securityContext | nindent 16 }}
              command:
                - java
                - -cp
                - app.jar
                - io.lattice.common.data.DataJobRunner
                - {{ $job }}
              env:
                - name: ELASTICSEARCH_URL
                  value: http://{{ include "lattice.fullname" $ }}-elasticsearch:9200
                # Names the cluster this job is pointed at. Unset means the job refuses outright: an
                # unnamed cluster is an unknown one, and that is the accident worth preventing.
                - name: LATTICE_ENV
                  value: {{ $.Values.dataJobs.environment | quote }}
                # The explicit opt-in. Even set to true, seed and reset still refuse against prod.
                - name: LATTICE_ALLOW_DATA_JOBS
                  value: {{ $.Values.dataJobs.allow | quote }}
{{- end }}
{{- end }}
