{{- if .Values.enabled }}
{{/*
  THIS BASELINE'S OWN BROKER (locked #44) - never a shared one.

  A StatefulSet, not a Deployment: the broker's journal and paging directories are not
  interchangeable between pods, so a Deployment that happened to run two replicas would have them
  writing the same volume. One replica, a stable name, and its own storage.

  The configuration below is split by what it actually is:

    - The SHARED files (broker.xml, the JAAS files, bootstrap.xml) are identical in every baseline
      and are read straight out of the chart with .Files.Glob. One source, so no baseline's broker
      can be configured differently from another's without someone meaning it.

    - The PEER TOPOLOGY (connectors.xml, federation.xml) is generated from values, because who this
      baseline's peers are is per environment. It defaults to naming NOBODY, which is a complete and
      valid baseline: hub-central names no peer either, and a joiner declares both directions itself so
      no existing broker is edited when one appears (locked #44).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lattice.fullname" . }}-artemis-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: mesh
data:
  {{- (.Files.Glob "files/artemis/*").AsConfig | nindent 2 }}

  connectors.xml: |
    <?xml version='1.0'?>
    <!-- Generated by the Lattice chart from the artemis subchart values. Do not edit in the cluster. -->
    <connectors xmlns="urn:activemq:core">
    {{- $tls := "sslEnabled=true;keyStorePath=${artemis.instance}/tls/keystore.p12;keyStoreType=PKCS12;keyStorePassword=${LATTICE_TLS_PASSWORD};trustStorePath=${artemis.instance}/tls/truststore.p12;trustStoreType=PKCS12;trustStorePassword=${LATTICE_TLS_PASSWORD}" }}
    {{- /* "self" is how a PEER reaches this broker, not how it reaches itself, so it must be an
           address that resolves from outside this baseline. It carries the full mutual-TLS
           parameters because a peer dials this string verbatim. */}}
    {{- /* The port a PEER dials is not necessarily the port this broker listens on. Inside the
           cluster the acceptor is on federationPort; from another cluster the same broker is
           reached through a NodePort or a load balancer, so the advertised port differs. They were
           one value while the mesh lived on a single flat network, and separating them is what
           lets a connector string be correct on the machine that interprets it. */}}
       <connector name="{{ .Values.global.baseline.clusterId }}-self">tcp://{{ .Values.advertisedHost | default (printf "%s-artemis" (include "lattice.fullname" .)) }}:{{ .Values.advertisedPort | default .Values.global.artemis.federationPort }}?{{ $tls }}</connector>
    {{- range .Values.peers }}
       <connector name="{{ .name }}">tcp://{{ .host }}:{{ .port | default $.Values.global.artemis.federationPort }}?{{ $tls }}</connector>
    {{- end }}
    </connectors>

  federation.xml: |
    <?xml version='1.0'?>
    <!-- Generated by the Lattice chart from the artemis subchart peers. Do not edit in the cluster. -->
    {{- if .Values.peers }}
    <federations xmlns="urn:activemq:core">
    {{- /* The federation NAME must be unique across the mesh: a broker keys arriving federations by
           name and silently discards one whose name it already holds, so a shared name loses a
           joiner. Named for the baseline that owns it, exactly as the links are. */}}
       <federation name="lattice-mesh-{{ .Values.global.baseline.clusterId }}">
    {{- range .Values.peers }}
          <upstream name="{{ $.Values.global.baseline.clusterId }}-from-{{ .name }}">
             <static-connectors>
                <connector-ref>{{ .name }}</connector-ref>
             </static-connectors>
             <policy ref="mesh-announce"/>
          </upstream>
    {{- end }}
    {{- range .Values.peers }}
          <downstream name="{{ $.Values.global.baseline.clusterId }}-to-{{ .name }}">
             <static-connectors>
                <connector-ref>{{ .name }}</connector-ref>
             </static-connectors>
             <policy ref="mesh-announce"/>
             <upstream-connector-ref>{{ $.Values.global.baseline.clusterId }}-self</upstream-connector-ref>
          </downstream>
    {{- end }}
          <address-policy name="mesh-announce" max-hops="1">
             <include address-match="{{ .Values.announceAddress }}"/>
          </address-policy>
       </federation>
    </federations>
    {{- else }}
    {{- /* No peers: deliberately empty, and still a complete baseline. What lets a future joiner
           command this broker to federate back is the generic role in broker.xml's security
           settings, which names nobody - so this baseline is never edited when a peer appears. */}}
    <federations xmlns="urn:activemq:core"/>
    {{- end }}
{{- end }}
