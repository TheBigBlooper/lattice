{{/*
  This baseline's OWN identity provider - one per baseline, never shared (locked #38/#48).

  A shared Keycloak would make one baseline privileged and would let a decision made elsewhere lock
  this one out or let it in, which is the same mistake a shared broker was. An operator working
  across three baselines holds three grants; that cost is accepted by the design.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lattice.fullname" . }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lattice.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      baseline-component: identity
  template:
    metadata:
      labels:
        {{- include "lattice.labels" . | nindent 8 }}
        baseline-component: identity
      {{- if .Values.global.keycloak.devMode }}
      annotations:
        # Rolls the pod when the realm changes. Without this a realm edit would sit in an updated
        # ConfigMap that the running Keycloak never reads, so `helm upgrade` would report success
        # while changing nothing observable.
        #
        # DEV MODE ONLY, and the condition is the point. Import runs only when the realm is absent,
        # so against a persisted database the roll would restart Keycloak, skip the import, and
        # change nothing - reporting a realm edit as applied when it was ignored. That is the same
        # silent no-op this annotation was added to remove, so it is not carried into the mode where
        # it would cause one. Changing a realm that already exists is an admin operation.
        checksum/realm: {{ (.Files.Get "files/lattice-realm.json") | sha256sum }}
      {{- end }}
    spec:
      {{- if and (not .Values.global.keycloak.devMode) .Values.global.keycloak.database.deployInCluster }}
      # Keycloak gates startup on its database, the same way a data-owning service gates on
      # Elasticsearch: it does not retry a connection it cannot make at boot, it exits, so without
      # this the pod crash-loops until MySQL finishes its first-start initialisation and reports the
      # ordinary case as a fault. A database this chart did NOT deploy gets no gate - the
      # environment owns its lifecycle and is presumed up.
      initContainers:
        - name: wait-for-keycloak-db
          image: {{ .Values.global.keycloak.database.image | quote }}
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h "{{ include "lattice.keycloakDbHost" . }}" --silent; do
                echo "waiting for keycloak database"
                sleep 5
              done
      {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args:
            {{- if .Values.global.keycloak.devMode }}
            - start-dev
            {{- else }}
            - start
            {{- end }}
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.adminPassword | quote }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Pins the address tokens are issued under, so a token's issuer is the same string
            # whether it was obtained by the console's browser or by a QA shell.
            - name: KC_HOSTNAME
              value: {{ .Values.global.keycloak.hostname | quote }}
            # Lets a service inside the cluster fetch signing keys at the in-cluster address without
            # changing that issuer. Two addresses, one realm.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            {{- if not .Values.global.keycloak.devMode }}
            # --- Persisted baseline ------------------------------------------------------------
            # Production mode DISABLES plain HTTP by default (http-enabled defaults to false, and is
            # on only in dev mode). Every in-cluster caller reaches Keycloak at http://...:8080 -
            # the services fetching signing keys, the mesh-gateway's identity probe, and both
            # probes on the management port - so without this the switch to `start` would take the
            # whole baseline's identity down while Keycloak itself reported healthy. TLS is
            # terminated in front of Keycloak, which is what makes plain HTTP here acceptable.
            - name: KC_HTTP_ENABLED
              value: "true"
            # Without this, /health/ready answers UP while the database is GONE - measured: the
            # database pod deleted, readiness 200/UP for over a minute, and every token request
            # failing with a 500. Keycloak's database check is not in the readiness group by
            # default; it "requires metrics", so enabling metrics is what puts it there. This is
            # the same defect class locked #67 fixed for Elasticsearch, where a ping answered
            # perfectly well while the cluster could not serve.
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_DB
              value: mysql
            - name: KC_DB_URL_HOST
              value: {{ include "lattice.keycloakDbHost" . | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.global.keycloak.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.global.keycloak.database.name | quote }}
            {{- if .Values.global.keycloak.database.urlProperties }}
            - name: KC_DB_URL_PROPERTIES
              value: {{ .Values.global.keycloak.database.urlProperties | quote }}
            {{- end }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.keycloak.database.credentialsSecret }}
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.keycloak.database.credentialsSecret }}
                  key: password
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          # The probes are on the MANAGEMENT port in Keycloak 26, not on 8080. Pointing them at the
          # http port yields 404s and a pod that never goes ready while serving perfectly.
          #
          # The startup probe is what makes the other two safe, and it is not optional in persisted
          # mode. Production startup runs a Quarkus build AND the Liquibase schema migration, which
          # took ~77s for one baseline and comfortably longer when several start on one node - past
          # what the liveness probe below tolerated. Killing Keycloak mid-migration is not a delay,
          # it is DATA LOSS: MySQL's DDL is non-transactional, so a half-applied migration does not
          # roll back, and every later start then fails on an inconsistent schema (measured:
          # "Unknown column 'COUNTER' in 'CREDENTIAL'"). The database has to be dropped to recover.
          # While this probe is failing, Kubernetes suspends the readiness and liveness probes
          # entirely, so a slow first start can no longer be mistaken for a dead one.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            # 10 minutes. Deliberately generous: the cost of waiting is a slow rollout, the cost of
            # being wrong is a corrupted schema.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
      volumes:
        - name: realm
          configMap:
            name: {{ include "lattice.fullname" . }}-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lattice.fullname" . }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: identity
spec:
  {{/* The browser must reach Keycloak at the SAME address tokens are issued under (keycloak.hostname),
       because that string is the issuer claim and is checked on validation. Locally that means the
       host can reach it, which in a three-cluster run needs a node port - a port-forward would work
       for a shell but not for a redirect the browser follows on its own. */}}
  type: {{ .Values.serviceType | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: {{ include "lattice.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    baseline-component: identity
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq (.Values.serviceType | default "ClusterIP") "NodePort") .Values.nodePort }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
---
{{/*
  The management port on its OWN Service, and the reason is the whole point of the endpoint.

  A ClusterIP Service routes to ready endpoints only, so the moment Keycloak reports itself unready -
  which, with the database check enabled, is exactly when its database has gone - it leaves the
  Service and the gateway's probe gets a connection refusal instead of the 503 that names the cause.
  Measured: via the Service, exit 7; straight to the pod, the full body naming the failing database
  check. A health endpoint unreachable precisely when unhealthy reports nothing, which is locked #46's
  rule in another place - a report about a broken link cannot travel over that link.

  publishNotReadyAddresses keeps it reachable while unready. It is set HERE and deliberately not on
  the Service above: application traffic on 8080 must still stop when Keycloak cannot serve, because
  routing a login to a broken Keycloak is worse than not routing it at all.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lattice.fullname" . }}-keycloak-management
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: identity
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "lattice.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    baseline-component: identity
  ports:
    - name: management
      port: 9000
      targetPort: management
