# This baseline's own Keycloak, one per baseline including locally (locked #48). The realm, issuer
# hostname, devMode and database block live in global, because every service validates tokens
# against them and they cross the component boundary. What is here is how this one is built
# and exposed.
enabled: true
image: quay.io/keycloak/keycloak:26.4.2
# Pulled from a public registry, never side-loaded, so it keeps its own policy rather than inheriting
# global.image.pullPolicy - which kind runs set to Never, leaving this stuck in ErrImageNeverPull.
pullPolicy: IfNotPresent

adminUser: admin
# Local bootstrap only. In a deployed environment this comes from a Secret, never from a value.
adminPassword: admin

serviceType: ClusterIP
nodePort: ""

# What this container may become. Strict, because it was measured as running non-root already.
# Separate from the umbrella's global.securityContext because what an image tolerates belongs to
# that image.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
