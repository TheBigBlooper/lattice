# The database a persisted Keycloak needs (locked #72), deployed only when
# global.keycloak.database.deployInCluster is true - one flag decides both whether this installs and
# what address Keycloak is given, so the two cannot disagree. It holds identity data only and no
# Lattice service connects to it. The image is in global, because Keycloak's init container waits
# on this database using it.
pullPolicy: IfNotPresent
storage: 5Gi

# Deliberately weaker than every other component: this image runs as root (measured uid 0) because
# the MySQL entrypoint chowns the data directory before dropping, so runAsNonRoot and dropping ALL
# capabilities would each trade a working database for a crash-loop. What is kept is the setting that
# still bites - no process here can gain more privilege than it began with.
securityContext:
  allowPrivilegeEscalation: false
