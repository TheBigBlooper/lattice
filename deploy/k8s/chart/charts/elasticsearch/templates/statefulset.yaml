{{/*
  This baseline's OWN Elasticsearch. Each baseline keeps its own, possibly divergent, data model and
  the clusters stay interoperable through the contract - so this is never shared with a peer.

  A StatefulSet rather than a Deployment because the data directory is not interchangeable between
  pods: a Deployment would happily start a second replica against the same volume and corrupt it.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lattice.fullname" . }}-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: datastore
spec:
  serviceName: {{ include "lattice.fullname" . }}-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lattice.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      baseline-component: datastore
  template:
    metadata:
      labels:
        {{- include "lattice.podLabels" . | nindent 8 }}
        baseline-component: datastore
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.global.elasticsearch.image | quote }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: discovery.type
              value: single-node
            # Local only - relaxed exactly as the compose stack does, and for the same reason: the
            # datastore is not exposed outside the baseline. A deployed environment turns this on.
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.heap | quote }}
            # REFUSE TO INVENT AN INDEX. By default a write to an unknown index creates it, which is
            # how a seed that beat its owning service turned `orders-write` - an ALIAS name - into a
            # real index, permanently blocking the alias and breaking that baseline for good.
            #
            # `+.*,-*` allows Elasticsearch's own dot-prefixed internal indices and denies everything
            # else, so every Lattice index must be created deliberately by the service that owns it.
            # Measured on a running cluster: a write to an unknown index is refused with "no such
            # index [x] and [action.auto_create_index] contains [-*] which forbids automatic creation
            # of the index", which names both the target and the reason. Without it, the same write
            # answers "result": "created" and says nothing at all.
            #
            # This is the datastore-level backstop. The seed also refuses before writing (DataJobs),
            # and the two cover different things: that one gives a better message to the operator who
            # hit it, this one covers every client, including ones we did not write.
            - name: action.auto_create_index
              value: {{ .Values.autoCreateIndex | quote }}
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lattice.fullname" . }}-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: datastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "lattice.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    baseline-component: datastore
  ports:
    - name: http
      port: 9200
      targetPort: http
