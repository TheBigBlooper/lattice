# This baseline's datastore. Set `elasticsearch.enabled=false` in the umbrella to run none and point
# the services at a managed one instead - the customer runs the clusters (locked #55).
#
# The IMAGE is not here: it lives in global, because the services' init container uses it to wait for
# the datastore, and two copies of a pinned version is how a client and a server drift apart.
pullPolicy: IfNotPresent
heap: -Xms512m -Xmx512m
storage: 2Gi

# Which index names Elasticsearch may create on its own. `+.*` allows its own internal dot-prefixed
# indices, which it needs; `-*` denies everything else, so every Lattice index is created
# deliberately by the service that owns it.
#
# A value, not a constant, because a deployment that runs something else against this datastore may
# legitimately need a pattern of its own - but widening it back to `true` reopens the way an
# alias name gets taken hostage by an index. See the statefulset for the incident.
autoCreateIndex: "+.*,-*"
