# This baseline's datastore. Set `elasticsearch.enabled=false` in the umbrella to run none and point
# the services at a managed one instead - the customer runs the clusters (locked #55).
#
# The IMAGE is not here: it lives in global, because the services' init container uses it to wait for
# the datastore, and two copies of a pinned version is how a client and a server drift apart.
pullPolicy: IfNotPresent
heap: -Xms512m -Xmx512m
storage: 2Gi

# Which index names Elasticsearch may create on its own: `+.*` allows its own internal dot-prefixed
# indices, `-*` denies the rest. A value rather than a constant because another workload may need its
# own pattern, but widening it back to `true` reopens the defect the statefulset records.
autoCreateIndex: "+.*,-*"

# What this container may become. Strict, because it was measured as running non-root already.
# Separate from the umbrella's global.securityContext because what an image tolerates belongs to
# that image.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
