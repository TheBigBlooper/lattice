# This baseline's status console (locked #16). One per baseline, and its API addresses are inlined
# into the bundle at BUILD time - so the image is per baseline too, and a shared one would point
# every baseline at whichever addresses it was built with.
enabled: true
replicas: 1

# Which per-baseline console image to run. deploy/k8s/mesh-clusters.sh sets this to the baseline name.
imageTag: ""

serviceType: ClusterIP
nodePort: ""

# What this container may become. Strict, because it was measured as running non-root already.
# Separate from the umbrella's global.securityContext because what an image tolerates belongs to
# that image.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
