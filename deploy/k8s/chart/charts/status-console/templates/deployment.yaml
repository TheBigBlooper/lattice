{{- if .Values.enabled }}
{{/*
  The status console ships as this baseline's OWN container, one per baseline (locked #16).

  It carries no environment here on purpose. The console is a static bundle, and its configuration
  (the API base URL, the realm, the client id) is baked in at IMAGE BUILD time as Vite build args -
  so a console image belongs to the baseline it was built for. Setting them here would have no
  effect and would read as though it did, which is worse than not setting them at all.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lattice.fullname" . }}-status-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: console
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lattice.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      baseline-component: console
  template:
    metadata:
      labels:
        {{- include "lattice.podLabels" . | nindent 8 }}
        baseline-component: console
    spec:
      containers:
        - name: status-console
          {{/* The console's API addresses are inlined into the bundle at BUILD time, so a console
               image belongs to exactly one baseline. imageTag lets a multi-baseline local run point
               each install at its own build; without it, one shared image sends every console to
               whichever baseline it happened to be built for. */}}
          image: {{ if .Values.imageTag }}{{ printf "lattice/status-console:%s" .Values.imageTag | quote }}{{ else }}{{ include "lattice.image" (dict "root" . "name" "status-console") | quote }}{{ end }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lattice.fullname" . }}-status-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    baseline-component: console
spec:
  {{/* ClusterIP by default: how an operator reaches the console is an environment decision, and in
       a real deployment it is an ingress hostname. NodePort exists for the local multi-cluster run,
       where each baseline lives in its own kind cluster and the node's port mapping is the only way
       a browser on the host can reach three separate clusters at three separate addresses. */}}
  type: {{ .Values.serviceType | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: {{ include "lattice.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    baseline-component: console
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq (.Values.serviceType | default "ClusterIP") "NodePort") .Values.nodePort }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
{{- end }}
