# Mesh-gateway service - provisional Kubernetes manifest stub.
#
# A minimal Deployment + Service so the mesh-gateway service has a starting point in the cluster. Values
# (image tag, registry, replica count, resource limits, the ConfigMap/Secret wiring for
# ELASTICSEARCH_URL and the mesh) are placeholders to be set when the deploy env naming + registry
# land. Probes read the unversioned operational endpoints: liveness /health, readiness /readiness.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-gateway
  namespace: lattice
  labels:
    app: mesh-gateway
    baseline-component: service
spec:
  # Deliberately ONE replica: the peer registry is in-memory per pod, so two replicas would each
  # hold their own view (the console could see different peer lists across requests) and both would
  # announce independently under the same cluster id. The gateway is not on a request-serving hot
  # path and a restart repopulates within one heartbeat, so this is an accepted MVP trade.
  replicas: 1
  selector:
    matchLabels:
      app: mesh-gateway
  template:
    metadata:
      labels:
        app: mesh-gateway
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mesh-gateway
          # Placeholder image reference; set to the registry-qualified tag when the registry lands.
          image: lattice/mesh-gateway:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            # Placeholders: point at the in-cluster Elasticsearch + Artemis when their services land.
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
            - name: ARTEMIS_URL
              value: "tcp://artemis:61616"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-gateway
  namespace: lattice
  labels:
    app: mesh-gateway
spec:
  selector:
    app: mesh-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
