---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-central-lattice-orders
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-elasticsearch
          image: elasticsearch:8.19.0
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: HTTP_PORT
              value: "8080"
      containers:
        - name: orders
          image: lattice/orders:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: ARTEMIS_USER
              valueFrom:
                secretKeyRef:
                  name: artemis-credentials
                  key: username
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artemis-credentials
                  key: password
          ports:
            - name: http
              containerPort: 8080
        - name: sidecar
          image: busybox
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: HTTP_PORT
              value: "9090"
---
apiVersion: v1
kind: Service
metadata:
  name: hub-central-lattice-orders
spec:
  ports:
    - name: http
      port: 8080
# A correct CronJob, which must NOT be flagged. Its container sits two levels deeper than a
# Deployment's, so this is where a depth assumption would show up as a false positive rather than as
# a silent miss - the failure that is cheap to notice, paired with the expensive one next door in
# cronjob-missing-security-context.yaml.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hub-central-lattice-data-reindex
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: data-job
              image: lattice/orders:0.1.0
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: LATTICE_ENV
                  value: local
                - name: LATTICE_ALLOW_DATA_JOBS
                  value: "false"
