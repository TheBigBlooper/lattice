---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-central-lattice-orders
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-elasticsearch
          image: elasticsearch:8.19.0
          env:
            - name: HTTP_PORT
              value: "8080"
      containers:
        - name: orders
          image: lattice/orders:0.1.0
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: ARTEMIS_USER
              valueFrom:
                secretKeyRef:
                  name: artemis-credentials
                  key: username
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artemis-credentials
                  key: password
          ports:
            - name: http
              containerPort: 8080
        - name: sidecar
          image: busybox
          env:
            - name: HTTP_PORT
              value: "9090"
---
apiVersion: v1
kind: Service
metadata:
  name: hub-central-lattice-orders
spec:
  ports:
    - name: http
      port: 8080
