# A CronJob whose container declares no securityContext. It must FAIL the lint.
#
# The shape the chart's data jobs now take, and two levels deeper than a Deployment's. The check
# reads a container's fields relative to the list that opened them, so the extra nesting must change
# nothing - a fixture proving only the old depth would pass while the real manifest went unread.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hub-central-lattice-data-seed
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: data-job
              image: lattice/orders:0.1.0
              command: ["java", "-cp", "app.jar", "Runner", "seed"]
