# A Job whose container declares no securityContext. It must FAIL the lint.
#
# The exemption this replaces existed because a Job's spec.template is immutable, which broke
# `helm upgrade` on the chart's data jobs. They are CronJobs now, whose jobTemplate is mutable, so
# the exemption became a hole waving through any context-less container that happened to be a Job.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hub-central-lattice-data-seed
spec:
  template:
    spec:
      containers:
        - name: data-job
          image: lattice/orders:0.1.0
          command: ["java", "-cp", "app.jar", "Runner", "seed"]
