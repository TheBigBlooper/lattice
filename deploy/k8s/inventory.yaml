# Inventory service - provisional Kubernetes manifest stub.
#
# A minimal Deployment + Service so the inventory service has a starting point in the cluster. Values
# (image tag, registry, replica count, resource limits, the ConfigMap/Secret wiring for
# ELASTICSEARCH_URL and the mesh) are placeholders to be set when the deploy env naming + registry
# land. Probes read the unversioned operational endpoints: liveness /health, readiness /readiness.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: lattice
  labels:
    app: inventory
    baseline-component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: inventory
          # Placeholder image reference; set to the registry-qualified tag when the registry lands.
          image: lattice/inventory:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            # Placeholders: point at the in-cluster Elasticsearch + Artemis when their services land.
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
            - name: ARTEMIS_URL
              value: "tcp://artemis:61616"
            # This baseline's own realm. KEYCLOAK_URL is the address a token's issuer claims (the
            # console's ingress host); KEYCLOAK_INTERNAL_URL is where this pod fetches the signing
            # keys. A service refuses to start without them rather than serve /api/v1 unprotected.
            - name: KEYCLOAK_URL
              value: "https://keycloak.example.invalid"   # placeholder: the baseline's ingress host
            - name: KEYCLOAK_INTERNAL_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_REALM
              value: "lattice"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: lattice
  labels:
    app: inventory
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 8080
      targetPort: http
