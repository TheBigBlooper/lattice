# Broker identity - how a baseline's certificate reaches its Artemis pod. Provisional stub, in the
# same state as the other manifests here: shapes and names are settled, values arrive with the deploy
# tooling (kustomize vs Helm) and the registry naming.
#
# The whole design in one line: EVERY BASELINE MOUNTS ITS OWN KEYSTORE AND THE SAME TRUSTSTORE.
# The truststore holds the Lattice certificate authority and nothing else, so it names no peer and
# never changes when a baseline joins - which is what keeps locked #44's no-edit-on-join guarantee
# true in Kubernetes exactly as it is in compose (locked #50).
#
# WHAT MUST NOT BE COMMITTED. The keystore holds this baseline's private key. It is a Secret, it is
# generated per environment, and it never appears in git - deploy/docker/artemis/tls/ is git-ignored
# for the same reason, and CI's secret scan would be right to fail on a key in a manifest. The
# stringData below is a PLACEHOLDER shape, not a value to fill in and commit.
#
# Generating the material for an environment uses the same script as local development:
#
#   deploy/docker/artemis/tls/issue-certs.sh issue <baseline>
#   kubectl create secret generic artemis-tls \
#     --namespace lattice \
#     --from-file=keystore.p12=deploy/docker/artemis/tls/<baseline>/keystore.p12 \
#     --from-file=truststore.p12=deploy/docker/artemis/tls/truststore.p12 \
#     --from-file=crl.pem=deploy/docker/artemis/tls/ca/crl.pem
#
# ROTATION, before the 825-day leaf expiry. Rotation is re-issuance against the SAME authority, which
# is why it costs one baseline a restart and costs its peers nothing: peers trust the authority, so a
# new certificate under the old authority needs no announcement and no peer edit.
#
#   deploy/docker/artemis/tls/issue-certs.sh rotate <baseline>   # new key + certificate, same CA
#   kubectl create secret generic artemis-tls ... --dry-run=client -o yaml | kubectl apply -f -
#   kubectl rollout restart statefulset/artemis --namespace lattice
#
# Rotating the AUTHORITY itself is the one expensive case, and it is deliberately not a one-liner: it
# invalidates every certificate at once, so it needs both authorities trusted during a transition
# (two entries in the truststore), then every baseline re-issued, then the old authority removed.
# Plan it; do not discover it the week the authority expires.
#
# REVOCATION. A compromised baseline is revoked at the authority, not by rotating everyone:
#
#   deploy/docker/artemis/tls/issue-certs.sh revoke <baseline>   # refreshes crl.pem
#
# then update the Secret's crl.pem and restart the PEERS' brokers so their acceptors re-read the
# list. The revoked baseline is not touched - it simply stops being accepted anywhere.
apiVersion: v1
kind: Secret
metadata:
  name: artemis-tls
  namespace: lattice
  labels:
    app: artemis
    baseline-component: mesh
type: Opaque
# Placeholder. Real data is created with `kubectl create secret` (above) or by the cluster's secret
# manager - never by editing values into this file.
stringData:
  keystore.p12: ""     # THIS baseline's key and certificate. Per baseline. Secret.
  truststore.p12: ""   # The Lattice authority, and nothing else. Identical in every baseline.
  crl.pem: ""          # Revoked certificates. Identical in every baseline. Not secret.
---
# How the broker consumes it. Fragment rather than a full StatefulSet: the Artemis workload manifest
# lands with the rest of the deploy tooling, and duplicating it here would create the second copy
# this project's reuse rule exists to prevent.
#
# The mount path is load-bearing and must match the acceptor and connector configuration in
# deploy/docker/artemis/broker.xml, which reads ${artemis.instance}/tls/. It is deliberately the same
# path in compose and in Kubernetes: the connector a joiner hands its peers is interpreted on the
# PEER, so a path that differed between environments would break federation in one of them only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: artemis-tls-mount-contract
  namespace: lattice
  labels:
    app: artemis
    baseline-component: mesh
data:
  README: |
    The artemis StatefulSet mounts the artemis-tls Secret at /var/lib/artemis-instance/tls, read-only:

      volumes:
        - name: artemis-tls
          secret:
            secretName: artemis-tls
      volumeMounts:
        - name: artemis-tls
          mountPath: /var/lib/artemis-instance/tls
          readOnly: true

    and sets LATTICE_TLS_PASSWORD from a Secret, never inline - broker.xml reads it as ${LATTICE_TLS_PASSWORD}.

    Port 61617 is the mutual-TLS federation acceptor and is reached only by peer brokers. It belongs
    on the mesh Service, not on any Service a workload in this baseline uses; 61616 stays internal to
    the baseline's own services.
