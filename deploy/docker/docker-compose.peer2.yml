# Lattice - the hub-west baseline, the THIRD cluster in the local stack.
#
# It exists to prove the one property two baselines cannot: loop prevention. With two brokers there
# is no loop to prevent, so `max-hops="1"` is correct but never exercised. With three, every broker
# is reachable from every other by two paths - directly, and via the third - so an announcement that
# was re-forwarded would arrive twice. This baseline turns that from an assertion into an observation.
#
# It is also the second JOINER, which is what proves onboarding cost stays linear and is paid by the
# joiner: it declares links to both existing baselines, and neither of them is edited, restarted, or
# redeployed (locked #44).
#
# Run the primary first (it owns the network), then the peer, then this one:
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   docker compose -f deploy/docker/docker-compose.peer.yml up -d
#   docker compose -f deploy/docker/docker-compose.peer2.yml up -d
#
# Or let the harness do it: ./deploy/docker/mesh-harness.sh up --three
#
# HEAVY: with all three up this is three Elasticsearch containers, three brokers, three Keycloaks,
# nine services and three consoles. Elasticsearch alone asks for 512m of heap each. Bring the third
# baseline up only for the loop-prevention pass, not for day-to-day work.

name: hub-west

services:
  elasticsearch-west:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9202:9200"                         # 9200 primary, 9201 peer
    volumes:
      - es-data-west:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - lattice

  artemis-west:
    # THIS baseline's own broker. As the second joiner its federation config names BOTH existing
    # peers in both directions; theirs name nobody new.
    image: apache/activemq-artemis:2.44.0-alpine
    environment:
      - ARTEMIS_USER=${ARTEMIS_USER:-artemis}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:-artemis}
      - LATTICE_TLS_PASSWORD=${LATTICE_TLS_PASSWORD:-lattice}
    ports:
      - "61618:61616"                       # 61616 primary, 61617 peer (all their OWN services' port)
      - "8163:8161"                         # web console; 8161 primary, 8162 peer
    volumes:
      # Not persisted, for the same reason as the others: the image applies etc-override only when
      # it creates the instance, so a persisted instance silently ignores config edits.
      - ../k8s/chart/files/artemis/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
      - ../k8s/chart/files/artemis/artemis-roles.properties:/var/lib/artemis-instance/etc-override/artemis-roles.properties:ro
      - ./artemis/hub-west/connectors.xml:/var/lib/artemis-instance/etc-override/connectors.xml:ro
      - ./artemis/hub-west/federation.xml:/var/lib/artemis-instance/etc-override/federation.xml:ro
      - ../k8s/chart/files/artemis/login.config:/var/lib/artemis-instance/etc-override/login.config:ro
      - ../k8s/chart/files/artemis/bootstrap.xml:/var/lib/artemis-instance/etc-override/bootstrap.xml:ro
      - ../k8s/chart/files/artemis/artemis-cert-users.properties:/var/lib/artemis-instance/etc-override/artemis-cert-users.properties:ro
      - ../k8s/chart/files/artemis/artemis-cert-roles.properties:/var/lib/artemis-instance/etc-override/artemis-cert-roles.properties:ro
      # The second joiner's certificate. Neither existing baseline is given it or edited to accept
      # it - both already trust the authority, which is what makes the join free (locked #44).
      - ./artemis/tls/hub-west/keystore.p12:/var/lib/artemis-instance/tls/keystore.p12:ro
      - ./artemis/tls/truststore.p12:/var/lib/artemis-instance/tls/truststore.p12:ro
      - ./artemis/tls/ca/crl.pem:/var/lib/artemis-instance/tls/crl.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --up --user ${ARTEMIS_USER:-artemis} --password ${ARTEMIS_PASSWORD:-artemis} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - lattice

  keycloak-west:
    # THIS baseline's own identity provider. A third realm, separate from the other two: an operator
    # working across three baselines holds three grants, which is the cost the design accepts.
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=http://localhost:8085
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    ports:
      - "8085:8080"                         # 8083 primary, 8084 peer
    volumes:
      - ../k8s/chart/files/lattice-realm.json:/opt/keycloak/data/import/lattice-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - lattice

  orders-west:
    build: ../../services/orders
    environment:
      # Which baseline this service belongs to, so what it serves can say so.
      - CLUSTER_ID=${CLUSTER_ID:-hub-west}
      - REGION=${REGION:-us-west}
      - BASELINE_VERSION=${BASELINE_VERSION:-0.1.0-SNAPSHOT}
      - HTTP_PORT=8080
      - ELASTICSEARCH_URL=http://elasticsearch-west:9200
      - KEYCLOAK_URL=http://localhost:8085
      - KEYCLOAK_INTERNAL_URL=http://keycloak-west:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-lattice}
      # Publishes the API docs (Swagger UI at /docs, document at /docs/json). A prod baseline sets false.
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
    ports:
      - "8100:8080"
    depends_on:
      elasticsearch-west:
        condition: service_healthy
      keycloak-west:
        condition: service_healthy
    networks:
      - lattice

  inventory-west:
    build: ../../services/inventory
    environment:
      # Which baseline this service belongs to, so what it serves can say so.
      - CLUSTER_ID=${CLUSTER_ID:-hub-west}
      - REGION=${REGION:-us-west}
      - BASELINE_VERSION=${BASELINE_VERSION:-0.1.0-SNAPSHOT}
      - HTTP_PORT=8080
      - ELASTICSEARCH_URL=http://elasticsearch-west:9200
      - KEYCLOAK_URL=http://localhost:8085
      - KEYCLOAK_INTERNAL_URL=http://keycloak-west:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-lattice}
      # Publishes the API docs (Swagger UI at /docs, document at /docs/json). A prod baseline sets false.
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
    ports:
      - "8101:8080"
    depends_on:
      elasticsearch-west:
        condition: service_healthy
      keycloak-west:
        condition: service_healthy
    networks:
      - lattice

  mesh-gateway-west:
    build: ../../services/mesh-gateway
    environment:
      - HTTP_PORT=8080
      - ARTEMIS_URL=tcp://artemis-west:61616
      - ARTEMIS_USER=${ARTEMIS_USER:-artemis}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:-artemis}
      - CLUSTER_ID=hub-west
      - REGION=us-west
      - BASELINE_VERSION=0.1.0-SNAPSHOT
      - CONSOLE_URL=http://localhost:3002
      - API_BASE_URL=http://localhost:8102/api/v1
      - CLUSTER_SERVICES=orders=http://orders-west:8080,inventory=http://inventory-west:8080
      # The infrastructure reported beside those services, as name:kind=url - the kind picks the probe.
      # Artemis carries no URL: its state is this gateway's own broker connection, not a second check.
      # Keycloak is addressed on its MANAGEMENT port, which is where it serves /health/ready.
      - CLUSTER_INFRASTRUCTURE=elasticsearch:elasticsearch=http://elasticsearch-west:9200,artemis:artemis=,keycloak:keycloak=http://keycloak-west:9000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}
      - KEYCLOAK_URL=http://localhost:8085
      - KEYCLOAK_INTERNAL_URL=http://keycloak-west:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-lattice}
      # Publishes the API docs (Swagger UI at /docs, document at /docs/json). A prod baseline sets false.
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
    ports:
      - "8102:8080"
    depends_on:
      keycloak-west:
        condition: service_healthy
    networks:
      - lattice

  status-console-west:
    build:
      context: ../../ui/status-console
      args:
        VITE_API_BASE_URL: http://localhost:8102/api/v1
        VITE_CLUSTER_ID: hub-west
        VITE_REGION: ${REGION:-us-west}
        VITE_BASELINE_VERSION: ${BASELINE_VERSION:-0.1.0-SNAPSHOT}
        VITE_KEYCLOAK_URL: http://localhost:8085
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lattice}
        VITE_KEYCLOAK_CLIENT_ID: lattice-console
    ports:
      - "3002:8080"                         # the port this baseline's CONSOLE_URL advertises
    depends_on:
      mesh-gateway-west:
        condition: service_started
    networks:
      - lattice

volumes:
  es-data-west:

networks:
  # The primary project's network, joined rather than created - the only thing the three baselines
  # share. Three routable sites, not shared infrastructure.
  lattice:
    external: true
    name: hub-central_lattice
