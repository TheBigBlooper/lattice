# What an authenticated peer baseline may do - identical in every baseline.
#
# ONE generic role for every peer, deliberately (locked #50). Artemis's certificate login modules map
# a distinguished name to a user, so granting one peer different permissions from another would mean
# naming that peer's distinguished name in every broker's configuration - edit-on-join again, which
# locked #44 forbids.
#
# So a certificate answers "which baseline is this, and is it one of ours" - never "what may this
# particular baseline do here". Every authenticated baseline gets the same federation permissions,
# which is sufficient because federation is symmetric by design: every baseline publishes and
# consumes the same announce address and none needs more than another. Differentiated per-peer
# authorization is recorded as deferred in the design; it needs a mechanism that does not exist today.
#
# lattice_federation is the same role name broker.xml's security-settings already grants, so the
# permission set is unchanged by the move to certificates - only how a peer proves it holds the role.
#
#   format: <role> = <user>,<user>,...
lattice_federation = lattice_peer
