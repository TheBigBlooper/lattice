# Which certificates are Lattice baselines - identical in every baseline.
#
# THIS FILE NAMES NO PEER, AND THAT IS THE WHOLE POINT. It is the file a naive per-baseline identity
# design would have to edit every time a baseline joined, which would destroy locked #44's
# no-edit-on-join guarantee by a second route (the first being per-baseline broker users).
#
# A value wrapped in slashes is compiled as a regular expression and full-matched against the
# certificate's distinguished name, rather than compared literally
# (ReloadableProperties.looksLikeRegexp -> Pattern.compile). One pattern therefore accepts EVERY
# baseline our authority signs, present and future, without any of them appearing here.
#
# The authority is what actually answers "is this one of ours" - the broker's truststore holds only
# the Lattice CA, so a certificate it did not sign never reaches this file at all. The pattern below
# is the second half of the question: "and is it shaped like a baseline". Both halves are needed;
# neither names a peer.
#
# FORM OF THE NAME, and why the pattern looks the way it does. The module matches against the legacy
# X509Certificate.getSubjectDN().getName(), which on this JDK renders the name REVERSED and spaced:
#
#   C=US, O=Lattice, OU=Lattice Baseline, CN=hub-east
#
# and not the RFC 2253 "CN=hub-east,OU=..." an openssl user would expect. That ordering is not
# guaranteed across providers, and a pattern that assumes one of them fails SILENTLY when it is
# wrong: the handshake still succeeds, the broker logs only "Unable to validate user", and the mesh
# simply never forms. So the three components are required independently of their order, using
# lookaheads, and the pattern ends in .* because the match is against the whole name.
#
#   format: <user> = /<regular expression over the distinguished name>/
lattice_peer = /(?=.*CN=[^,]+)(?=.*OU=Lattice Baseline)(?=.*O=Lattice).*/
