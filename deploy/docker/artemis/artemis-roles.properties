# Lattice broker roles - identical in every baseline.
#
# amq                is the image's own broker user, used by this baseline's services.
# lattice_federation is the shared federation role named by downstream-authorization: a peer's
#                    downstream command is only accepted from a user holding it (locked #45, one
#                    shared role per environment for MVP, per-baseline broker identity deferred).
amq = artemis
lattice_federation = artemis
