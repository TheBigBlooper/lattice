# Lattice - a SECOND baseline, for two-cluster interop QA (qa_protocol.md mesh checklist).
#
# Stands up an independent cluster - its own Elasticsearch, orders and inventory - that shares only
# the mesh broker with the primary project. That sharing is the point: under Shape A the mesh is the
# one thing clusters have in common, and each baseline keeps its own, possibly divergent, data model.
#
# Run the primary project first (it owns the broker and the network), then:
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   docker compose -f deploy/docker/docker-compose.peer.yml up -d
#
# Service names are suffixed -peer deliberately. Both projects sit on one Docker network, and a
# duplicate name would register the same DNS alias twice, so a gateway could silently poll the OTHER
# cluster's services. The health rollup still reports them as plain "orders"/"inventory", since
# CLUSTER_SERVICES maps a display name to a URL.

name: lattice-peer

services:
  elasticsearch-peer:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"                         # distinct host port; the primary holds 9200
    volumes:
      - es-data-peer:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - lattice

  orders-peer:
    build: ../../services/orders
    environment:
      - HTTP_PORT=8080
      - ELASTICSEARCH_URL=http://elasticsearch-peer:9200
      - ARTEMIS_URL=tcp://artemis:61616     # the shared broker, owned by the primary project
      - ARTEMIS_USER=${ARTEMIS_USER:-artemis}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:-artemis}
    ports:
      - "8090:8080"
    depends_on:
      elasticsearch-peer:
        condition: service_healthy
    networks:
      - lattice

  inventory-peer:
    build: ../../services/inventory
    environment:
      - HTTP_PORT=8080
      - ELASTICSEARCH_URL=http://elasticsearch-peer:9200
      - ARTEMIS_URL=tcp://artemis:61616
      - ARTEMIS_USER=${ARTEMIS_USER:-artemis}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:-artemis}
    ports:
      - "8091:8080"
    depends_on:
      elasticsearch-peer:
        condition: service_healthy
    networks:
      - lattice

  mesh-gateway-peer:
    build: ../../services/mesh-gateway
    environment:
      - HTTP_PORT=8080
      - ARTEMIS_URL=tcp://artemis:61616
      - ARTEMIS_USER=${ARTEMIS_USER:-artemis}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:-artemis}
      - CLUSTER_ID=hub-east
      - REGION=us-east
      - BASELINE_VERSION=0.1.0-SNAPSHOT
      # Where PEERS reach this baseline: host-reachable addresses, not compose names.
      - CONSOLE_URL=http://localhost:3001
      - API_BASE_URL=http://localhost:8092/api/v1
      # Display name -> URL, so the rollup reads "orders"/"inventory" while addressing this
      # cluster's own containers.
      - CLUSTER_SERVICES=orders=http://orders-peer:8080,inventory=http://inventory-peer:8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8092:8080"
    networks:
      - lattice

volumes:
  es-data-peer:

networks:
  # The primary project's network, joined rather than created: the broker lives there, and the mesh
  # is the only thing the two baselines share.
  lattice:
    external: true
    name: lattice_lattice
