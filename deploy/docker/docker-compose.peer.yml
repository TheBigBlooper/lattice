# Lattice - the hub-east baseline, for two-cluster interop QA (qa_protocol.md mesh checklist).
#
# Stands up a fully independent baseline: its own Elasticsearch, its own Artemis broker, and its own
# services. It shares NOTHING with the primary project except a Docker network, which models two
# sites that can route to each other.
#
# That independence is the point (locked #44). This project used to borrow the primary's broker,
# which made the primary privileged: taking it down took the whole mesh with it, and federation - the
# one mechanism the topology turns on - was never exercised at all.
#
# Run the primary project first (it owns the network), then:
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   docker compose -f deploy/docker/docker-compose.peer.yml up -d
#
# Service names are suffixed -east deliberately. Both projects sit on one Docker network, and a
# duplicate name would register the same DNS alias twice, so a gateway could silently poll the OTHER
# cluster's services. The health rollup still reports them as plain "orders"/"inventory", since
# CLUSTER_SERVICES maps a display name to a URL.

name: hub-east

services:
  elasticsearch-east:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"                         # distinct host port; the primary holds 9200
    volumes:
      - es-data-east:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - lattice

  artemis-east:
    # THIS baseline's own broker. It is the JOINING baseline in the local stack: its federation
    # config names the primary in both directions (upstream + downstream), which is what lets the
    # primary discover it without being edited, restarted, or redeployed (locked #44).
    image: apache/activemq-artemis:2.44.0-alpine
    environment:
      - ARTEMIS_USER=${ARTEMIS_USER:-artemis}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:-artemis}
      - LATTICE_TLS_PASSWORD=${LATTICE_TLS_PASSWORD:-lattice}
    ports:
      # Host 61617 reaches this broker's 61616, its own services' port. It is NOT the federation
      # port: 61617 inside every container is the mutual-TLS acceptor, and it is never published.
      - "61617:61616"                       # distinct host port; the primary holds 61616
      - "8162:8161"                         # web console / management
    volumes:
      # Not persisted, for the same reason as the primary: the image applies etc-override only when
      # it creates the instance, so a persisted instance would silently ignore config edits.
      - ../k8s/chart/files/artemis/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
      - ../k8s/chart/files/artemis/artemis-roles.properties:/var/lib/artemis-instance/etc-override/artemis-roles.properties:ro
      - ./artemis/hub-east/connectors.xml:/var/lib/artemis-instance/etc-override/connectors.xml:ro
      - ./artemis/hub-east/federation.xml:/var/lib/artemis-instance/etc-override/federation.xml:ro
      - ../k8s/chart/files/artemis/login.config:/var/lib/artemis-instance/etc-override/login.config:ro
      - ../k8s/chart/files/artemis/bootstrap.xml:/var/lib/artemis-instance/etc-override/bootstrap.xml:ro
      - ../k8s/chart/files/artemis/artemis-cert-users.properties:/var/lib/artemis-instance/etc-override/artemis-cert-users.properties:ro
      - ../k8s/chart/files/artemis/artemis-cert-roles.properties:/var/lib/artemis-instance/etc-override/artemis-cert-roles.properties:ro
      # This baseline's own certificate. hub-central is never given a copy of it, and never needs one:
      # it trusts the authority that signed it, which is the whole no-edit-on-join argument.
      - ./artemis/tls/hub-east/keystore.p12:/var/lib/artemis-instance/tls/keystore.p12:ro
      - ./artemis/tls/truststore.p12:/var/lib/artemis-instance/tls/truststore.p12:ro
      - ./artemis/tls/ca/crl.pem:/var/lib/artemis-instance/tls/crl.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --up --user ${ARTEMIS_USER:-artemis} --password ${ARTEMIS_PASSWORD:-artemis} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - lattice

  keycloak-east:
    # THIS baseline's OWN identity provider, entirely separate from the primary's. That separation is
    # the property under test: an operator holding a hub-central token is a stranger here, because
    # identity belongs to the baseline that owns the data. Same realm name and same role names on both
    # sides - only the membership and the signing keys differ.
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=http://localhost:8084
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    ports:
      - "8084:8080"                         # distinct host port; the primary holds 8083
    volumes:
      # The same committed realm file: standard role and group names everywhere is what makes a token
      # interpretable wherever it was issued. Not persisted, for the same reason as the primary.
      - ../k8s/chart/files/lattice-realm.json:/opt/keycloak/data/import/lattice-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - lattice

  orders-east:
    build: ../../services/orders
    environment:
      # Which baseline this service belongs to, so what it serves can say so.
      - CLUSTER_ID=${CLUSTER_ID:-hub-east}
      - REGION=${REGION:-us-east}
      - BASELINE_VERSION=${BASELINE_VERSION:-0.1.0-SNAPSHOT}
      - HTTP_PORT=8080
      - ELASTICSEARCH_URL=http://elasticsearch-east:9200
      # The console calls this service directly from the browser, so it needs the same cross-origin
      # allowance the gateway already has. Without it the browser refuses the request before it is
      # made, which surfaces as "could not reach" and never mentions CORS.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}
      # This baseline's OWN realm. A service never addresses a peer's Keycloak, for the same reason it
      # never addresses a peer's broker.
      - KEYCLOAK_URL=http://localhost:8084
      - KEYCLOAK_INTERNAL_URL=http://keycloak-east:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-lattice}
      # Publishes the API docs (Swagger UI at /docs, document at /docs/json). A prod baseline sets false.
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
    ports:
      - "8090:8080"
    depends_on:
      elasticsearch-east:
        condition: service_healthy
      keycloak-east:
        condition: service_healthy
    networks:
      - lattice

  inventory-east:
    build: ../../services/inventory
    environment:
      # Which baseline this service belongs to, so what it serves can say so.
      - CLUSTER_ID=${CLUSTER_ID:-hub-east}
      - REGION=${REGION:-us-east}
      - BASELINE_VERSION=${BASELINE_VERSION:-0.1.0-SNAPSHOT}
      - HTTP_PORT=8080
      - ELASTICSEARCH_URL=http://elasticsearch-east:9200
      # The console calls this service directly from the browser, so it needs the same cross-origin
      # allowance the gateway already has. Without it the browser refuses the request before it is
      # made, which surfaces as "could not reach" and never mentions CORS.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}
      - KEYCLOAK_URL=http://localhost:8084
      - KEYCLOAK_INTERNAL_URL=http://keycloak-east:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-lattice}
      # Publishes the API docs (Swagger UI at /docs, document at /docs/json). A prod baseline sets false.
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
    ports:
      - "8091:8080"
    depends_on:
      elasticsearch-east:
        condition: service_healthy
      keycloak-east:
        condition: service_healthy
    networks:
      - lattice

  mesh-gateway-east:
    build: ../../services/mesh-gateway
    environment:
      - HTTP_PORT=8080
      # This baseline's OWN broker. A service never addresses a peer's broker: federation is
      # broker-to-broker, so ARTEMIS_URL stays single-valued (locked #44).
      - ARTEMIS_URL=tcp://artemis-east:61616
      - ARTEMIS_USER=${ARTEMIS_USER:-artemis}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:-artemis}
      - CLUSTER_ID=hub-east
      - REGION=us-east
      - BASELINE_VERSION=0.1.0-SNAPSHOT
      # Where PEERS reach this baseline: host-reachable addresses, not compose names.
      - CONSOLE_URL=http://localhost:3001
      - API_BASE_URL=http://localhost:8092/api/v1
      # Display name -> URL, so the rollup reads "orders"/"inventory" while addressing this
      # cluster's own containers.
      - CLUSTER_SERVICES=orders=http://orders-east:8080,inventory=http://inventory-east:8080
      # The infrastructure reported beside those services, as name:kind=url - the kind picks the probe.
      # Artemis carries no URL: its state is this gateway's own broker connection, not a second check.
      # Keycloak is addressed on its MANAGEMENT port, which is where it serves /health/ready.
      - CLUSTER_INFRASTRUCTURE=elasticsearch:elasticsearch=http://elasticsearch-east:9200,artemis:artemis=,keycloak:keycloak=http://keycloak-east:9000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173}
      - KEYCLOAK_URL=http://localhost:8084
      - KEYCLOAK_INTERNAL_URL=http://keycloak-east:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-lattice}
      # Publishes the API docs (Swagger UI at /docs, document at /docs/json). A prod baseline sets false.
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
    ports:
      - "8092:8080"
    depends_on:
      keycloak-east:
        condition: service_healthy
    networks:
      - lattice

  status-console-east:
    # This baseline's OWN console, on its own port. The two consoles are what make the Shape A
    # redirect real locally: hub-central advertises :3000 and hub-east advertises :3001, so following
    # a peer's consoleUrl genuinely lands on that baseline's console and its own sign-in.
    build:
      context: ../../ui/status-console
      args:
        VITE_API_BASE_URL: http://localhost:8092/api/v1
        VITE_ORDERS_BASE_URL: http://localhost:8090/api/v1
        VITE_INVENTORY_BASE_URL: http://localhost:8091/api/v1
        VITE_CLUSTER_ID: hub-east
        VITE_REGION: ${REGION:-us-east}
        VITE_BASELINE_VERSION: ${BASELINE_VERSION:-0.1.0-SNAPSHOT}
        VITE_KEYCLOAK_URL: http://localhost:8084
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lattice}
        VITE_KEYCLOAK_CLIENT_ID: lattice-console
    ports:
      - "3001:8080"                         # the port this baseline's CONSOLE_URL advertises
    depends_on:
      mesh-gateway-east:
        condition: service_started
    networks:
      - lattice

volumes:
  es-data-east:

networks:
  # The primary project's network, joined rather than created. It is the only thing the two baselines
  # share - two routable sites, not shared infrastructure. Each runs its own broker.
  lattice:
    external: true
    name: hub-central_lattice
