# Serves the built console. Two things here are load-bearing rather than boilerplate.
#
# Port 8080, not 80: binding below 1024 needs root, and the platform image standard says no
# process in the container runs as root.
#
# The try_files fallback: the console is a single-page app with a code-owned route table, so a
# deep link or a refresh on any route must return index.html and let the router resolve it.
# Without this, every URL except the root 404s once an operator reloads the page.
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 8080;
    # Also bind IPv6: inside a container `localhost` commonly resolves to ::1 first, and the
    # stock image's script that would add this cannot run against a supplied config. Without it
    # the container healthcheck is refused and the container reports unhealthy forever, while
    # serving perfectly well to everything outside it.
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The hashed asset filenames change on every build, so they are safe to cache hard.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # index.html is never cached: it is what points at the current asset hashes, so a stale copy
    # pins an operator to a previous build indefinitely.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
