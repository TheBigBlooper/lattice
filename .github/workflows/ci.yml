name: CI

# The authoritative full-reactor run, including the Testcontainers suites the pre-push hook skips.
# The repository is public, so Actions is free and there is no minutes budget (locked #74).
# See core_protocol.md "CI triggers + QA-iteration discipline".
on:
  # Push is the only trigger, covering the two moments that need a run: the final commit before a
  # merge into dev, and the squashed commit that lands on dev. There is deliberately no
  # pull_request trigger and none on main - the reasoning and what it gives up are in locked #76.
  #
  # Every prefix that can open a pull request into dev must be listed. `mvnw verify` is a REQUIRED
  # check there, so a branch this does not match produces zero checks and can never merge - which
  # is what the end-of-day `docs-changelog-<date>` branch hit.
  push:
    branches: [dev, 'lat-*', 'docs-*']
  workflow_dispatch:

# One run per branch. A rapid series of pushes would otherwise queue a run per commit; superseded
# runs are cancelled rather than left reporting on a commit nobody is waiting for.
# Never cancels on dev - that run is what a promotion fast-forwards onto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  verify:
    name: mvnw verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The canonical gate across every module; GitHub-hosted runners provide the Docker daemon
      # Testcontainers needs. `verify` runs `package` first, so the CycloneDX plugin emits
      # target/bom.json as a side effect and no extra build step is needed.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

      # Hand the resolved SBOM to the scan job. Maven is the only thing that can resolve
      # this reactor's own unpublished SNAPSHOT modules, so the graph must be produced
      # here rather than re-derived by the scanner.
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 7

  # The status console's clean-room backstop: the same `verify` the pre-push hook runs locally,
  # re-run on a pristine machine, which catches a check that only passed because of something in a
  # developer's working copy.
  console:
    name: Status console verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui/status-console
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version comes from the console package.json's packageManager field, so it lives in one
      # place. package_json_file is required: `defaults.run.working-directory` applies to `run:`
      # steps only, so without it the action looks at the repository root and reports no version.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/status-console/package.json

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ui/status-console/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/status-console/pnpm-lock.yaml

      # --frozen-lockfile fails rather than silently resolving different versions than the
      # lockfile pins, so CI builds what a developer built.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

  # Supply-chain gate, blocking. It consumes the SBOM the verify job produced, so it runs after it
  # rather than paying for a second full Maven build to re-derive the graph.
  dependency-scan:
    name: Dependency scan (OSV)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read

    steps:
      # Needed for the console's lockfile; the SBOM arrives as an artifact rather than
      # from the tree, because only Maven can resolve this reactor's own SNAPSHOT modules.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom

      # Scans the Maven-built SBOM rather than the poms: pointed at the poms the scanner resolves
      # remotely, cannot see this reactor's SNAPSHOT modules, and reports a clean run having scanned
      # nothing (locked #40). The console's lockfile is separate - the SBOM holds no Node packages.
      - name: OSV scan
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source -L bom.json -L ui/status-console/pnpm-lock.yaml

  # Registry packs cover the language and security surface; the committed rules file covers what is
  # specific to Lattice. Semgrep is here rather than in the local verify because it is a Python tool,
  # so the design-token rule is enforced twice - deliberate defence in depth for the likeliest slip.
  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Semgrep
        run: pip install semgrep==1.171.0

      # --error fails the build on any finding. --metrics=off stops telemetry and has no
      # effect on the rules or the findings. No SARIF upload: Code Scanning is free on a public
      # repo, but --error FAILS the build where a dashboard only reports, so it stays the gate.
      - name: Semgrep scan
        run: >-
          semgrep scan
          --config p/java
          --config p/typescript
          --config p/react
          --config p/owasp-top-ten
          --config p/jwt
          --config p/secrets
          --config .semgrep/lattice-rules.yml
          --metrics=off
          --error

  # Secret scan over the whole git history, not just the working tree: a credential removed in
  # a later commit is still published in the one that added it.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks reads history, which the default shallow clone does not fetch.
          fetch-depth: 0

      # Allowlists live in the committed .gitleaks.toml, which is picked up automatically from
      # the scanned path. Each entry names a value committed on purpose and says why it is
      # worthless to an attacker.
      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner

  # The chart is otherwise unscanned: a Helm template is not valid YAML, so Semgrep skips it and the
  # only manifests it ever saw were the lint fixtures. Rendering first is what turns the chart into
  # something a checker can read, and needs no cluster.
  chart-check:
    name: Chart render check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          # The same major the chart is developed against. Helm 4 applies server-side, which is what
          # rejects a duplicate environment key outright rather than tolerating it - so a Helm 3
          # runner would render happily and miss the class of defect this job exists to catch.
          version: v4.2.3

      # Self-tests against its fixtures first, then renders every baseline. A duplicate environment
      # key is an install failure rather than a style point: Helm 4 applies server-side and rejects
      # the manifest, which once left the chart unable to install a single service.
      - name: Render every baseline and check it
        run: ./deploy/k8s/mesh-clusters.sh check

  # Lints the workflow files themselves - shell injection in `run:` steps, and references to actions
  # or contexts that do not exist. A broken workflow otherwise shows up only when it runs.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
