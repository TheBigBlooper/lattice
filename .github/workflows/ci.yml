name: CI

# Private repo on the GitHub Free plan (2,000 Actions minutes/month), so CI is
# deliberately sparing: the full-reactor `./mvnw verify` runs LOCALLY on every
# push via the committed pre-push hook (.githooks/pre-push), which is the primary
# gate. GitHub Actions runs only as a clean-room backstop on the dev->main
# promotion PR, plus on-demand via manual dispatch. See core_protocol.md
# "CI triggers + QA-iteration discipline".
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: mvnw verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The canonical gate: compile + unit + (as they land) Testcontainers
      # integration tests across every module, plus the fast quality gates
      # (Spotless, Checkstyle, JaCoCo, Enforcer, SpotBugs). GitHub-hosted
      # runners provide the Docker daemon Testcontainers needs.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

  # Supply-chain gate, deliberately a SEPARATE job so it runs concurrently with the
  # reactor build instead of serializing behind it. Blocking: a failure fails the run.
  dependency-scan:
    name: Dependency scan (OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OSV-Scanner queries osv.dev for advisories affecting the resolved dependency
      # graph, rather than downloading a local copy of the whole CVE catalog the way
      # OWASP Dependency-Check did - so it needs no API key and finishes in seconds
      # instead of tens of minutes. `scan source -r .` walks every module's pom.xml;
      # transitive dependencies are resolved by default (via deps.dev), which is where
      # most real risk lives. Run from the pinned official binary rather than the
      # osv-scanner-action, which is a reusable workflow that uploads SARIF to GitHub
      # Code Scanning (needs Advanced Security, which this private repo lacks).
      #
      # Known gap: test-scoped dependencies are not yet included in OSV-Scanner's Maven
      # graph. They do not ship in the runtime images, so they are not production attack
      # surface, but they remain a build-time supply-chain risk.
      #
      # Suppressions, when needed, go in an osv-scanner.toml at the repo root (loaded
      # automatically), each with a documented reason and the condition to remove it.
      - name: OSV scan
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source -r .
