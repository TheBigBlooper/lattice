name: CI

# Private repo on the GitHub Free plan (2,000 Actions minutes/month), so CI is
# deliberately sparing: the full-reactor `./mvnw verify` runs LOCALLY on every
# push via the committed pre-push hook (.githooks/pre-push), which is the primary
# gate. GitHub Actions runs only as a clean-room backstop on the dev->main
# promotion PR, plus on-demand via manual dispatch. See core_protocol.md
# "CI triggers + QA-iteration discipline".
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: mvnw verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The canonical gate: compile + unit + (as they land) Testcontainers
      # integration tests across every module, plus the fast quality gates
      # (Spotless, Checkstyle, JaCoCo, Enforcer, SpotBugs). GitHub-hosted
      # runners provide the Docker daemon Testcontainers needs.
      # `verify` runs `package` first, so the CycloneDX plugin emits target/bom.json as a
      # side effect - no extra build step needed.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

      # Hand the resolved SBOM to the scan job. Maven is the only thing that can resolve
      # this reactor's own unpublished SNAPSHOT modules, so the graph must be produced
      # here rather than re-derived by the scanner.
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 7

  # Supply-chain gate. It consumes the SBOM the verify job produced, so it necessarily
  # runs after it - the scan itself takes seconds, so the added wall-clock is negligible
  # and this avoids paying for a second full Maven build just to re-derive the graph.
  # Blocking: a failure fails the run.
  dependency-scan:
    name: Dependency scan (OSV)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      # OSV-Scanner queries osv.dev for advisories affecting the components in the SBOM,
      # rather than downloading a local copy of the whole CVE catalog the way OWASP
      # Dependency-Check did - so it needs no API key and finishes in seconds instead of
      # tens of minutes.
      #
      # It scans the SBOM rather than the pom.xml files directly, and that is deliberate:
      # pointing it at the poms makes it resolve the graph remotely via deps.dev, which
      # cannot see io.lattice's own 0.1.0-SNAPSHOT modules. That resolution failure
      # cascades and silently filters out EVERY third-party transitive, reporting a clean
      # "0 vulnerabilities" while having scanned nothing. The Maven-built SBOM avoids
      # that entirely (see google/osv-scanner issue 348).
      #
      # `-L` points at a lockfile or SBOM; the CycloneDX format is auto-identified.
      # Run from the pinned official binary rather than the osv-scanner-action, which is
      # a reusable workflow that uploads SARIF to GitHub Code Scanning (needs Advanced
      # Security, which this private repo lacks).
      #
      # Known gap: test-scoped dependencies are excluded from the aggregate SBOM. They do
      # not ship in the runtime images, so they are not production attack surface, but
      # they remain a build-time supply-chain risk.
      #
      # Suppressions, when needed, go in an osv-scanner.toml at the repo root (loaded
      # automatically), each with a documented reason and the condition to remove it.
      - name: OSV scan
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source -L bom.json
